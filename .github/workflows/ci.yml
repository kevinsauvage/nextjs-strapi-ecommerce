name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main', 'master']

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

      - name: Run TypeScript type check
        run: yarn lint-ts

      - name: Run Stylelint
        run: yarn lint:css

      # TODO: Add test step when tests are implemented
      # - name: Run tests
      #   run: yarn test

      - name: Run codegen (if env vars available)
        run: yarn codegen
        env:
          SHOPIFY_STORE_FRONT_ACCESS_TOKEN: ${{ secrets.SHOPIFY_STORE_FRONT_ACCESS_TOKEN }}
          SHOPIFY_STORE_FRONT_ADMIN_TOKEN: ${{ secrets.SHOPIFY_STORE_FRONT_ADMIN_TOKEN }}
        continue-on-error: true
        # Note: Codegen requires Shopify API tokens. If secrets are not configured,
        # this step will be skipped without failing the build.

